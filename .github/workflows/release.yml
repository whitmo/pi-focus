name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - name: Pack release artifact
        run: mkdir dist && npm pack --pack-destination dist
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
